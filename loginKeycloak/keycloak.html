<script src="https://cdn.jsdelivr.net/npm/keycloak-js@latest/dist/keycloak.min.js"></script>
<script>
  const keycloak = new Keycloak({
    url: 'http://localhost:8080',
    realm: 'meu-realm',
    clientId: 'meu-projeto'
  });

  keycloak.init({ onLoad: 'login-required' })
    .then(authenticated => {
      if (authenticated) {
        console.log('Autenticado!');
        // Armazene o token para chamadas à API
        localStorage.setItem('kc-token', keycloak.token);
        
        // Faça chamadas à API protegida
        fetch('http://localhost:3000/protected', {
          headers: {
            'Authorization': 'Bearer ' + keycloak.token
          }
        }).then(/* ... */);
      }
    });
</script>
