<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Geral</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background: #f8f9fa; }
        .dashboard-container { max-width: 1200px; margin: 40px auto; }
        .chart-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0001; padding: 2rem; margin-bottom: 2rem; }
        .chart-title { margin-bottom: 1rem; }
        .row { gap: 2rem 0; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1 class="mb-4">Dashboard Geral</h1>
        <div class="row">
            <div class="col-md-6 chart-box">
                <h4 class="chart-title">Contratos por Tipo</h4>
                <canvas id="contratosChart"></canvas>
            </div>
            <div class="col-md-6 chart-box">
                <h4 class="chart-title">Projetos por Status</h4>
                <canvas id="projetosChart"></canvas>
            </div>
            <div class="col-md-6 chart-box">
                <h4 class="chart-title">Identidades por Perfil</h4>
                <canvas id="identidadesChart"></canvas>
            </div>
        </div>
    </div>

    <script src="/FrontEnd/Dashboard/dashboard.js"></script>
    
</body>
</html>
