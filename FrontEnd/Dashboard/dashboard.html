<script>

document.addEventListener('DOMContentLoaded', function() {
    async function displayUsername() {
        const usernameElement = document.getElementById('username-display')
        if (!usernameElement) {
            console.error('Elemento username-display não encontrado')
            return;
        }

        // Recupera o token do localStorage (armazenado durante o login)
        const token = localStorage.getItem('token');
        if (!token) {
            usernameElement.textContent = 'Visitante'
            console.warn('Token não encontrado no LocalStorage')
            return;
        }

        if (token.length < 30) {
            console.error('Token parece inválido', token)
            usernameElement.textContent = 'Usuário';
            return;
        }

    try {
        const response = await fetch('http://localhost:3000/api/user', {
        method: 'GET',
        headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        },
            credentials: 'include'
        });

        if (response.status === 403) {
            console.error('Acesso proibido - token pode estar inválido ou expirado');
            localStorage.removeItem('token'); // Remove token inválido
            window.location.href = '/login.html'; // Redireciona para login
            return;
        }
             
        if (!response.ok) {
            throw new Error(`Erro HTTP: ${response.status}`);
        }
        
        const data = await response.json();
        if (data.success && data.user) {
            usernameElement.textContent = data.user.nome || data.user.username;
        } else {
                throw new Error(data.message || 'Dados do usuário não encontrados');
        }
    }   catch (error) {
            console.error('Erro ao buscar nome do usuário:', error);
            usernameElement.textContent = 'Usuário'

    }
}

    displayUsername();
});

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");

if (menuToggle && sidebar) {
    menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("closed");
        menuToggle.textContent = sidebar.classList.contains("closed") ? "☰" : "✕"
});
} else {
    console.error('Elementos do menu não encontrados');
}


// Active dentro dos links para ficar fixado(marcado), como = "CONTRATO" "PROJETOS" "DOCUMENTOS" "IDENTIDADES" "OUTROS" !!!
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        const linkPage = link.getAttribute('href').split('/').pop();
        if (linkPage === currentPage) {
            const navItem = link.closest('.nav-item')
            if (navItem) {
                navItem.classList.add('active')
            }
        }
    });

</script>
