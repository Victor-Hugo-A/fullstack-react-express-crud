<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao sistema</title>
    <link rel="stylesheet" href="/FrontEnd/login.css">
    <link rel="stylesheet" href="//use.fontawesome.com/releases/v5.0.7/css/all.css">
    <link rel="icon" href="data:,"> <!-- Desativa a busca por favicon -->
</head>

<body>
    <img class="DIPEN" src="/FrontEnd/img/logo_dipen.png" alt="logo_dipen"/>
    <div id="login-container">
        <div id="mensagem-login" role="status" aria-live="polite"></div>
        <div id="login" class="auth-section">
            <img src="/FrontEnd/img/senappenLogo.png" alt="MJ" class="img"/>
            <h1>Acessar o sistema</h1>
            <form id="loginForm">
                <div class="input-icon-wrapper">
                    <label class="visually-hidden" for="username">Usuário</label>
                    <i class="fas fa-id-badge" aria-hidden="true"></i>
                    <input type="text" id="username" name="username" autocomplete="username" required placeholder="Digite o seu usuário">
                </div>

            <div class="input-icon-wrapper">
                <label class="visually-hidden" for="password">Senha</label>
                <i class="fas fa-lock" aria-hidden="true"></i>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Digite a sua senha">
            </div>
            <button type="submit">Login</button>
        </form>
        
        <p><a href="#criar-conta" id="toggle-register">Crie uma conta aqui.</a></p>
    </div>


<div id="criar-conta" class="auth-section register" style="display: none;">
        <h2>Criar Conta</h2>
        <form id="registerForm">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite o seu nome completo">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required placeholder="Digite seu cpf (apenas números)" maxlength="14" pattern="\d{3}\.?\d{3}\.?\d{3}-?\d{2}">
            <small class="text-muted">Ex: 123.456.789-09 ou 12345678909</small>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required placeholder="Digite o seu e-mail">
            
            <label for="new-username">Usuário:</label>
            <input type="text" id="new-username" name="new-username" required placeholder="Crie um nome de usuário">
            
            <label for="new-password">Senha:</label>
            <input type="password" id="new-password" name="new-password" minlength="8" required placeholder="Crie uma senha">
            
            <label for="confirm-password">Confirmar Senha:</label>
            <input type="password" id="confirm-password" name="confirm-password" minlength="8" required placeholder="Confirme sua senha">
                        
            

            
            <button type="submit">Criar Conta</button>
        </form>
        <p>Já tem uma conta? <a href="#login" id="toggle-login">Faça login aqui</a>.</p>
    </div>
</div>

<script src="/FrontEnd/login.js" defer></script>
</body>
</html>
