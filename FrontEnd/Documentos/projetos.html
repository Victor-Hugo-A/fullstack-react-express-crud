<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAPPEN - Gerenciamento de Projetos</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/FrontEnd/Documentos/documentos.css">
</head>

<body>
    
    <div class="app-container">
        <!-- Sidebar -->
        <button id="menuToggle">✕</button>
        <nav id="sidebar" class="sidebar">

            <div class="sidebar-brand">
                <a href="/FrontEnd/Documentos/documentos.html">
                    <img src="/FrontEnd/img/MJ.png" alt="Logo MJ" class="logo">
                </a>
            </div>

        <ul class="sidebar-nav">
            <li class="nav-item active">
                <a href="/FrontEnd/Documentos/documentos.html" class="nav-link">
                    <i class="fas fa-clipboard icon"></i>
                    <span class="link-text">Documentos</span>
                </a>
            </li>
            <li class="nav-item contract">
                    <a href="/FrontEnd/Documentos/contrato.html" class="nav-link nav-contract" >
                        <i class="fas fa-file-contract icon"></i>
                        <span class="link-text">Contratos</span>
                    </a>
            </li>
            <li class="nav-item project">
                <a href="/FrontEnd/Documentos/projetos.html" class="nav-link nav-project">
                    <i class="fas fa-diagram-project icon"></i>
                    <span class="link-text">Projetos</span>
                </a>
            </li>
            <li class="nav-item identity">
                <a href="/FrontEnd/Documentos/identidades.html" class="nav-link nav-identify">
                    <i class="fas fa-id-card icon"></i>
                    <span class="link-text">Identidades</span>
                </a>
            </li>
            <li class="nav-item others">
                <a href="outros" class="nav-link nav-others">
                    <img src="/FrontEnd/img/grafico-result.png" alt="Gráficos" class="icon">
                        <span class="link-text">Gráficos</span>
                </a>
            </li>
        </ul>
    </nav>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="main-header">
                <h1 class="page-title">Gerenciamento de Projetos</h1>
                <div class="user-actions">
                    <span class="username" id="username-display"></span>
                    <a href="/FrontEnd/Sistema/sistema.html" class="home-btn">
                        <i class="fas fa-home"></i>
                    </a>
                </div>
            </header>

            <div id="project-message" class="message" style="display: none;"></div>
            <!-- Seção de Criação de Projeto -->
            <section class="document-section">
                <h2 class="section-title"><i class="fas fa-plus-circle me-2"></i>Criar Novo Projeto</h2>
                
                
                <form id="project-form" class="document-form">
                    <div class="form-group">
                        <label for="project-name">Nome do Projeto:</label>
                        <input type="text" id="project-name" class="form-control" placeholder="Nome do projeto" required>
                    </div>

                    <div class="form-group">
                        <label for="project-code">Código do Projeto:</label>
                        <input type="text" id="project-code" class="form-control" placeholder="Código único do projeto" required>
                    </div>

                    <div class="form-group">
                        <label for="project-manager">Responsável:</label>
                        <input type="text" id="project-manager" class="form-control" placeholder="Nome do responsável" required>
                    </div>

                    <div class="form-group">
                        <label for="project-start">Data de Início:</label>
                        <input type="date" id="project-start" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="project-end">Previsão de Término:</label>
                        <input type="date" id="project-end" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="project-status">Status:</label>
                        <select id="project-status" class="form-control" required>
                            <option value="planejamento">Planejamento</option>
                            <option value="andamento">Em Andamento</option>
                            <option value="suspenso">Suspenso</option>
                            <option value="concluido">Concluído</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="project-description">Descrição:</label>
                        <textarea id="project-description" class="form-control" rows="4" placeholder="Detalhes sobre o projeto..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="project-files">Documentos Relacionados:</label>
                        <input type="file" id="project-files" class="form-control" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
                        <small class="form-text" style="margin-left: 4px;">Anexe documentos relevantes (múltiplos arquivos permitidos)</small>
                    </div>

                    <div class="form-actions">
                        <button type="submit" title="Salvar Projeto" class="btn-submit">
                            <i class="fas fa-save me-2" title="Salvar"></i>Salvar Projeto
                        </button>
                        <button type="reset"  title="Limpar Formulário"  class="btn-cancel">
                            <i class="fas fa-times me-2" title="Limpar"></i>Limpar Formulário
                        </button>
                    </div>
                </form>
            </section>

            <!-- Seção de Listagem de Projetos -->
            <section class="document-section">
                <h2 class="section-title"><i class="fas fa-project-diagram me-2"></i>Projetos Cadastrados</h2>
                
                <div class="document-filters">
                    <div class="filter-group">
                        <label for="filter-status">Filtrar por status:</label>
                        <select id="filter-status" class="form-control">
                            <option value="">Todos os status</option>
                            <option value="planejamento">Planejamento</option>
                            <option value="andamento">Em Andamento</option>
                            <option value="suspenso">Suspenso</option>
                            <option value="concluido">Concluído</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="filter-year">Filtrar por ano:</label>
                        <select id="filter-year" class="form-control">
                            <option value="">Todos os anos</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label for="search-project">Pesquisar:</label>
                        <div class="search-input">
                            <input type="text" id="search-project" class="form-control" placeholder="Nome, código ou responsável...">
                            <button class="search-btn"><i class="fas fa-search"></i></button>
                        </div>
                    </div>
                </div>
                
                <div id="loading-projects" class="loading">
                    <i class="fas fa-spinner fa-spin me-2"></i>Carregando projetos...
                </div>
                
                
            </section>
        </main>
    </div>
    <div class="pagination">
        <a href="#" class="page-nav" data-page="prev"><i class="fas fa-angle-double-left"></i></a>
        <a href="#" class="page-link active" data-page="1">1</a>
        <a href="#" class="page-link" data-page="2">2</a>
        <a href="#" class="page-link" data-page="3">3</a>
        <a href="#" class="page-nav" data-page="next"><i class="fas fa-angle-double-right"></i></a>
    </div>
    
    

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/FrontEnd/Documentos/projetos.js"></script>


<script>

        async function displayUsername() {
            const usernameElement = document.getElementById('username-display')
        try {
            // Recupera o token do localStorage (armazenado durante o login)
            const token = localStorage.getItem('token');
        if (!token) {
            usernameElement.textContent = 'Visitante'
            return;
            }
    
        const response = await fetch('http://localhost:3000/api/user', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
                }
            });


        if (!response.ok){
            const errorData = await response.json().catch(() => null);
            throw new Error(errorData?.message || `Erro HTTP: ${response.status}`);
        }
         
        const data = await response.json();
    
        if (data.success && data.user) {
            usernameElement.textContent = data.user.nome || data.user.username;
        } else {
            throw new Error(data.message || 'Erro ao obter dados do usuário:');
        }
        } catch (error) {
            console.error('Erro ao buscar nome do usuário:', error);
            usernameElement.textContent = 'Usuário'

        if (error.message.includes('401')) {
            window.location.href = '/login.html'
        }
    }
}
    // Chama a função quando a página carrega
    document.addEventListener('DOMContentLoaded', displayUsername);

    const menuToggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");

    if (menuToggle && sidebar) {
        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("closed");
            menuToggle.textContent = sidebar.classList.contains("closed") ? "☰" : "✕"
    });
    } else {
        console.error('Elementos do menu não encontrados');
    }


    // Active dentro dos links para ficar fixado(marcado), como = "CONTRATO" "PROJETOS" "DOCUMENTOS" "IDENTIDADES" "OUTROS" !!!
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const linkPage = link.getAttribute('href').split('/').pop();
            if (linkPage === currentPage) {
                const navItem = link.closest('.nav-item')
                if (navItem) {
                    navItem.classList.add('active')
                }
            }
        });
    });

</script>


</body>
</html>
