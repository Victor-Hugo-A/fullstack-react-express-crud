</head>

    <!-- Mensagem de feedback -->

    <main class="main-content">

                <h1 class="page-title">Documentos de Identidades</h1>
            <div class="user-actions">
                <span class="username" id="username-display">Usuário</span>

    <!-- Formulário de cadastro de identidade -->
    <section class="identity-form-section">
        <form id="identity-form" enctype="multipart/form-data" class="card p-3 mb-4">
            <h2 class="mb-3">Nova Identidade</h2>
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" id="nome" name="nome" required placeholder="Nome Completo">
            </div>
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
            </div>
            <div class="mb-3">
                <label for="endereco" class="form-label">Endereço de Residência:</label>
                <input type="text" class="form-control" id="endereco" name="endereco" required placeholder="Rua, Número, Bairro, Cidade, Estado"> 
            </div>
            <div class="mb-3">
                <label for="perfil" class="form-label">Perfil:</label>
                <select class="form-control" id="perfil" name="perfil" required>
                    <option value="">Selecione</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Usuário">Usuário</option>
                    <option value="Visitante">Visitante</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="foto" class="form-label">Foto 3x4:</label>
                <input type="file" class="form-control" id="foto" name="foto" accept="image/*" required>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <button type="submit" title="Salvar Identidade" class="btn btn-primary">
                Salvar Identidade
                </button>
                <i class="fas fa-info-circle info-icon" title="Preencha todos os campos corretamente e envie uma foto 3x4 recente."></i>
            </div> 
        </form>
    </section>

    <!-- Lista de identidades cadastradas -->
    <section class="identity-list-section">
        <h2 class="section-title"> 
        <i class="fas fa-id-card icon"></i>
            Identidades Cadastradas 
        </h2>
        
        <div class="table-responsive">
            <table class="table table-bordered align-middle" id="identities-table">
                <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Endereço</th>
                        <th>Perfil</th>
                        <th>Foto</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas de identidades serão inseridas via JS -->
                </tbody>
                
            </table>
        </div>
    </section>

</main>

    <div id="image-modal" class="modal" style="display:none; position: fixed; z-index: 9999; top:0px;;
    width: 70%; background: rgba(0, 0, 0, 0.5);  align-items: center; justify-content: center;">
    <span id="close-modal" style="position: absolute; top: 20px; right: 40px; font-size: 2rem; color: #fff; cursor:pointer;">&times;</span>
    <img id="modal-image" src="" alt="Imagem da Identidade" style="max-width: 90vw; max-height: 90vh; border-radius:8px;  box-shadow:  0 0 20px #000;">
    </div>


<script> 

// Função para exibir o nome de usuário
        async function displayUsername() {
            const usernameElement = document.getElementById('username-display')
        try {
            // Recupera o token do localStorage (armazenado durante o login)
            const token = localStorage.getItem('token');
        if (!token) {
            usernameElement.textContent = 'Visitante'
            return;
            }
    
        const response = await fetch('http://localhost:3000/api/user', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
                }
            });


        if (!response.ok){
            const errorData = await response.json().catch(() => null);
            throw new Error(errorData?.message || `Erro HTTP: ${response.status}`);
        }
         
        const data = await response.json();
    
        if (data.success && data.user) {
            usernameElement.textContent = data.user.nome || data.user.username;
        } else {
            throw new Error(data.message || 'Erro ao obter dados do usuário:');
        }
        } catch (error) {
            console.error('Erro ao buscar nome do usuário:', error);
            usernameElement.textContent = 'Usuário'

        if (error.message.includes('401')) {
            window.location.href = '/login.html'
        }
    }
}

    // Chama a função quando a página carrega
    document.addEventListener('DOMContentLoaded', displayUsername);

    document.addEventListener('DOMContentLoaded', function() {
    const menuToggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");

    if (menuToggle && sidebar) {
        menuToggle.addEventListener("click", () => {
            sidebar.classList.toggle("closed");
            menuToggle.textContent = sidebar.classList.contains("closed") ? "☰" : "✕"
    });
    } else {
        console.error('Elementos do menu não encontrados');
    }

    // Active dentro dos links para ficar fixado(marcado), como = "CONTRATOS" "PROJETOS" "DOCUMENTOS" "IDENTIDADES" "OUTROS" !!!
        const currentPage = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('.nav-link');
        
        navLinks.forEach(link => {
            const linkPage = link.getAttribute('href').split('/').pop();
            if (linkPage === currentPage) {
                const navItem = link.closest('.nav-item')
                if (navItem) {
                    navItem.classList.add('active')
                }
            }
        });
    });

    </script>
</body>
