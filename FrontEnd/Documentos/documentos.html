<script>
    const API_BASE_URL = 'http://localhost:3000/api';

async function atualizarBadges() {
    // Defina os endpoints e seletores dos badges
    const recursos = [
        { endpoint: 'contracts', badgeSelector: '.document-card.contract .badge', texto: 'contratos registrados' },
        { endpoint: 'projects', badgeSelector: '.document-card.project .badge', texto: 'projetos registrados' },
        { endpoint: 'identities', badgeSelector: '.document-card.identity .badge', texto: 'identidades registradas' }
    ];

    for (const recurso of recursos) {
        try {
            const res = await fetch(`${API_BASE_URL}/${recurso.endpoint}/count`);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const badge = document.querySelector(recurso.badgeSelector);
            if (badge) badge.textContent = `${data.count} ${recurso.texto}`;
        } catch {
            // Se der erro, mostra 0
            const badge = document.querySelector(recurso.badgeSelector);
            if (badge) badge.textContent = `0 ${recurso.texto}`;
        }
    }
}

// Chame ao carregar a página
document.addEventListener('DOMContentLoaded', atualizarBadges);

// E chame também após adicionar/excluir em cada página específica
        async function displayUsername() {
            const usernameElement = document.getElementById('username-display')
        try {
            // Recupera o token do localStorage (armazenado durante o login)
            const token = localStorage.getItem('token');
        if (!token) {
            usernameElement.textContent = 'Visitante'
            return;
            }
    
        const response = await fetch('http://localhost:3000/api/user', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
                }
            });


        if (!response.ok){
            const errorData = await response.json().catch(() => null);
            throw new Error(errorData?.message || `Erro HTTP: ${response.status}`);
        }
         
        const data = await response.json();
    
        if (data.success && data.user) {
            usernameElement.textContent = data.user.nome || data.user.username;
        } else {
            throw new Error(data.message || 'Erro ao obter dados do usuário:');
        }
        } catch (error) {
            console.error('Erro ao buscar nome do usuário:', error);
            usernameElement.textContent = 'Usuário'

        if (error.message.includes('401')) {
            window.location.href = '/login.html'
        }
    }
}
    // Chama a função quando a página carrega
    document.addEventListener('DOMContentLoaded', displayUsername);


const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");

if (menuToggle && sidebar) {
    menuToggle.addEventListener("click", () => {
        sidebar.classList.toggle("closed");
        menuToggle.textContent = sidebar.classList.contains("closed") ? "☰" : "✕"
});
} else {
    console.error('Elementos do menu não encontrados');
}


// Active dentro dos links para ficar fixado(marcado), como = "CONTRATO" "PROJETOS" "DOCUMENTOS" "IDENTIDADES" "OUTROS" !!!
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const navLinks = document.querySelectorAll('.nav-link');
    
    navLinks.forEach(link => {
        const linkPage = link.getAttribute('href').split('/').pop();
        if (linkPage === currentPage) {
            const navItem = link.closest('.nav-item')
            if (navItem) {
                navItem.classList.add('active')
            }
        }
    });
});


</script>
